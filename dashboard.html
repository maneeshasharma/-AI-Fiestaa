<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>?</text></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai maneesha - Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #08090b; color: #f9fafb; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-panel {
            background: rgba(17, 24, 39, 0.6);
            -webkit--webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stream-content pre {
            background: #111827; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto;
            border: 1px solid #374151; margin-top: 0.5rem; margin-bottom: 0.5rem;
        }
        .stream-content code { font-family: monospace; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="antialiased selection:bg-brand-500/30 selection:text-brand-200 h-screen flex">

    <!-- Left Sidebar -->
    <aside id="sidebar" class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col transition-all duration-300 shrink-0">
        <!-- Brand & New Chat -->
        <div class="p-4 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-500 to-teal-400 flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.5)]">
                    <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
                </div>
                <span class="font-bold text-sm text-white tracking-wide">Ai maneesha</span>
            </div>
            <button id="collapse-sidebar" class="text-gray-500 hover:text-white transition-colors">
                <i data-lucide="panel-left-close" class="w-4 h-4"></i>
            </button>
        </div>
        
        <div class="p-4">
            <button id="new-chat-btn" class="w-full py-2 px-4 rounded-full bg-brand-600/10 hover:bg-brand-600/20 text-brand-400 border border-brand-500/30 shadow-[0_0_15px_rgba(16,185,129,0.1)] transition-all flex items-center justify-center gap-2 text-sm font-medium">
                <i data-lucide="plus" class="w-4 h-4"></i> New Chat
            </button>
        </div>

        <!-- Mode Selector -->
        <div class="px-4 pb-4 border-b border-gray-800/50">
            <label class="text-[10px] uppercase text-gray-500 font-semibold tracking-wider mb-2 block">System Persona</label>
            <select id="mode-select" class="w-full bg-gray-900 border border-gray-700 text-gray-300 text-xs rounded-lg px-3 py-2 outline-none hover:border-gray-600 transition-colors appearance-none focus:border-brand-500 cursor-pointer bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2210%22%20height%3D%225%22%20viewBox%3D%220%200%2010%205%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M0%200L5%205L10%200H0Z%22%20fill%3D%22%239CA3AF%22%2F%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[center_right_0.75rem]">
                <option value="General Query">General Query</option>
                <option value="Deep Code Review">Deep Code Review</option>
                <option value="Marketing Copy & SEO">Marketing Copy & SEO</option>
                <option value="Quick Summary & Synthesis">Quick Summary & Synthesis</option>
            </select>
        </div>

        <!-- History -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4">
            <label class="text-[10px] uppercase text-gray-500 font-semibold tracking-wider mb-2 block">Recent Chats</label>
            <div id="history-list" class="space-y-1">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 border-t border-gray-800 bg-gray-900/30">
            <div class="flex items-center gap-3">
                <img src="https://i.pravatar.cc/100?img=14" alt="User" class="w-8 h-8 rounded-full border border-gray-700">
                <div class="flex flex-col flex-1 truncate">
                    <span id="user-name" class="text-xs font-medium text-gray-300 truncate"></span>
                    <span id="user-email" class="text-[10px] text-brand-400 font-semibold truncate"></span>
                </div>
                <a href="#" onclick="localStorage.removeItem('aifiesta_current_user'); window.location.href='index.html'" class="text-gray-500 hover:text-red-400 transition-colors shrink-0" title="Log Out">

    </aside>

    <!-- Main Canvas -->
    <main class="flex-1 flex flex-col relative min-w-0">
        <!-- Top Bar -->
        <header class="h-14 border-b border-gray-800 bg-gray-900/50 flex items-center justify-between px-6 shrink-0 z-20">
            <div class="flex items-center gap-2 group">
                <h1 id="chat-title" class="text-sm font-medium text-gray-200">New Conversation</h1>
                <button class="text-gray-500 opacity-0 group-hover:opacity-100 transition-opacity hover:text-white">
                    <i data-lucide="pencil" class="w-3 h-3"></i>

            </div>
            
            <!-- Model Toggles -->
            <div class="flex items-center gap-4 bg-gray-950 px-3 py-1.5 rounded-full border border-gray-800" id="model-toggles">
                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors">
                    <input type="checkbox" checked value="gpt" class="model-toggle accent-[#10a37f]"> <i data-lucide="zap" class="w-3 h-3 text-[#10a37f]"></i> GPT-4o

                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors">

                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors">

                <label class="flex items-center gap-1.5 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors">

        </div>

        <!-- 4-Column Grid Area -->
        <div class="flex-1 overflow-hidden relative">
            <div id="grid-container" class="grid grid-cols-4 h-full divide-x divide-gray-800 transition-all duration-300">
                <!-- Col 1: GPT-4o -->
                <div class="flex flex-col h-full bg-gray-900/20 relative col-model" id="col-gpt" data-model="gpt">
                    <div class="p-3 border-b border-gray-800/50 flex items-center justify-between bg-gray-900/40 group relative shrink-0">

                </div>

                <!-- Col 2: Claude 3.7 -->
                <div class="flex flex-col h-full bg-gray-900/20 relative col-model" id="col-claude" data-model="claude">
                    <div class="p-3 border-b border-gray-800/50 flex items-center justify-between bg-gray-900/40 group relative shrink-0">
                        <div class="flex items-center gap-2">
                            <div class="w-5 h-5 rounded-full bg-[#d97757] flex items-center justify-center shrink-0"><i data-lucide="feather" class="w-3 h-3 text-white"></i></div>
                            <span class="text-xs font-semibold text-gray-300 flex items-center gap-1">Claude 3.7 <i data-lucide="trophy" class="w-3 h-3 text-yellow-400 hidden trophy-icon" id="trophy-claude"></i></span>
                        </div>

                                <span class="text-[10px] text-gray-400 font-mono flex items-center gap-1" title="Generation Rate"><i data-lucide="zap" class="w-2.5 h-2.5 text-yellow-500"></i> <span class="rate-val">--</span></span>

                            </div>
                            <span class="text-[9px] text-gray-500 font-mono"><span class="words-val">0</span>w | <span class="chars-val">0</span>c</span>
                        </div>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar text-[11px] text-gray-300 font-mono leading-relaxed stream-content pb-24" id="stream-claude"></div>
                </div>

                <!-- Col 3: Gemini -->
                <div class="flex flex-col h-full bg-gray-900/20 relative col-model" id="col-gemini" data-model="gemini">
                    <div class="p-3 border-b border-gray-800/50 flex items-center justify-between bg-gray-900/40 group relative shrink-0">
                        <div class="flex items-center gap-2">
                            <div class="w-5 h-5 rounded-full bg-[#4285f4] flex items-center justify-center shrink-0"><i data-lucide="sparkle" class="w-3 h-3 text-white"></i></div>
                            <span class="text-xs font-semibold text-gray-300 flex items-center gap-1">Gemini 2.5 <i data-lucide="trophy" class="w-3 h-3 text-yellow-400 hidden trophy-icon" id="trophy-gemini"></i></span>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] text-gray-400 font-mono flex items-center gap-1" title="Latency"><i data-lucide="clock" class="w-2.5 h-2.5 text-[#4285f4]"></i> <span class="latency-val">--</span></span>
                                <span class="text-[10px] text-gray-400 font-mono flex items-center gap-1" title="Generation Rate"><i data-lucide="zap" class="w-2.5 h-2.5 text-yellow-500"></i> <span class="rate-val">--</span></span>
                                <button class="copy-btn opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-white" data-target="stream-gemini"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            </div>
                            <span class="text-[9px] text-gray-500 font-mono"><span class="words-val">0</span>w | <span class="chars-val">0</span>c</span>
                        </div>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar text-[11px] text-gray-300 font-mono leading-relaxed stream-content pb-24" id="stream-gemini"></div>
                </div>

                <!-- Col 4: DeepSeek -->
                <div class="flex flex-col h-full bg-gray-900/20 relative col-model" id="col-deepseek" data-model="deepseek">
                    <div class="p-3 border-b border-gray-800/50 flex items-center justify-between bg-gray-900/40 group relative shrink-0">

                            <div class="w-5 h-5 rounded-full bg-[#4d6bfe] flex items-center justify-center shrink-0"><i data-lucide="brain" class="w-3 h-3 text-white"></i></div>
                            <span class="text-xs font-semibold text-gray-300 flex items-center gap-1">DeepSeek R1 <i data-lucide="trophy" class="w-3 h-3 text-yellow-400 hidden trophy-icon" id="trophy-deepseek"></i></span>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] text-gray-400 font-mono flex items-center gap-1" title="Latency"><i data-lucide="clock" class="w-2.5 h-2.5 text-[#4d6bfe]"></i> <span class="latency-val">--</span></span>
                                <span class="text-[10px] text-gray-400 font-mono flex items-center gap-1" title="Generation Rate"><i data-lucide="zap" class="w-2.5 h-2.5 text-yellow-500"></i> <span class="rate-val">--</span></span>
                                <button class="copy-btn opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-white" data-target="stream-deepseek"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            </div>
                            <span class="text-[9px] text-gray-500 font-mono"><span class="words-val">0</span>w | <span class="chars-val">0</span>c</span>
                        </div>
                    </div>
                    <div class="p-4 flex-1 overflow-y-auto custom-scrollbar text-[11px] text-gray-300 font-mono leading-relaxed stream-content pb-24" id="stream-deepseek"></div>
                </div>
            </div>
            
            <!-- Bottom Floating Prompt -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 w-full max-w-3xl z-30 px-4">
                <div class="glass-panel rounded-2xl p-3 flex flex-col gap-2 shadow-2xl shadow-brand-500/10 border border-gray-700/60">
                    <!-- Presets -->
                    <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2 pt-1 px-1">
                        <button class="preset-pill px-3 py-1 rounded-full bg-gray-900 border border-gray-800 text-xs text-gray-300 whitespace-nowrap hover:bg-gray-800 hover:text-white transition-colors" data-prompt="🚀 Microservices vs Monolith">🚀 Microservices vs Monolith</button>
                        <button class="preset-pill px-3 py-1 rounded-full bg-gray-900 border border-gray-800 text-xs text-gray-300 whitespace-nowrap hover:bg-gray-800 hover:text-white transition-colors" data-prompt="⚡ High-Concurrency Node.js">⚡ High-Concurrency Node.js</button>
                        <button class="preset-pill px-3 py-1 rounded-full bg-gray-900 border border-gray-800 text-xs text-gray-300 whitespace-nowrap hover:bg-gray-800 hover:text-white transition-colors" data-prompt="🎯 Explain Backpropagation Simply">🎯 Explain Backpropagation Simply</button>
                    </div>
                    <div class="flex items-end gap-2">
                        <div class="flex-1 bg-gray-950/80 border border-gray-700/50 rounded-xl p-3 flex items-center shadow-inner relative">
                            <textarea id="prompt-input" rows="1" class="w-full bg-transparent text-sm text-gray-200 outline-none resize-none hide-scrollbar placeholder-gray-500" placeholder="Type a prompt for the active models..." autocomplete="off"></textarea>
                        </div>
                        <button class="w-10 h-10 rounded-xl bg-gray-800 flex items-center justify-center text-brand-400 shrink-0 hover:bg-gray-700 transition-colors border border-gray-700 hover:border-brand-500/50 shadow-md" id="enhance-btn" title="Enhance Prompt (Magic Wand)">
                            <i data-lucide="wand-2" class="w-4 h-4"></i>
                        </button>
                        <button class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-teal-500 flex items-center justify-center text-white shrink-0 hover:from-brand-500 hover:to-teal-400 transition-colors shadow-[0_0_15px_rgba(16,185,129,0.3)]" id="send-btn">
                            <i data-lucide="arrow-up" class="w-5 h-5"></i>
                        </button>

                </div>
            </div>
        </div>
    </main>

    <script>
        // --- AUTH & USER BINDING ---
        const currentUser = JSON.parse(localStorage.getItem('aifiesta_current_user'));
        if (!currentUser) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-name').textContent = currentUser.name || 'User';
            document.getElementById('user-email').textContent = currentUser.email || '';
        }
        
        lucide.createIcons();

        // Elements
        const gridContainer = document.getElementById('grid-container');
        const toggles = document.querySelectorAll('.model-toggle');
        const cols = document.querySelectorAll('.col-model');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const enhanceBtn = document.getElementById('enhance-btn');
        const modeSelect = document.getElementById('mode-select');
        const historyList = document.getElementById('history-list');
        const chatTitle = document.getElementById('chat-title');
        
        let isGenerating = false;
        let sessions = JSON.parse(localStorage.getItem('aifiesta_history')) || [];
        let activeSessionId = null;

        // --- GRID DYNAMICS ---
        const updateGrid = () => {
            let activeCount = 0;
            toggles.forEach(toggle => {
                const col = document.getElementById(`col-${toggle.value}`);
                if (toggle.checked) {
                    col.style.display = 'flex';
                    activeCount++;
                } else {
                    col.style.display = 'none';
                }
            });
            gridContainer.className = `grid h-full divide-x divide-gray-800 transition-all duration-300 grid-cols-${Math.max(1, activeCount)}`;
        };

        toggles.forEach(toggle => {
            toggle.addEventListener('change', updateGrid);
        });
        updateGrid();

        // --- SIDEBAR TOGGLE ---
        const sidebar = document.getElementById('sidebar');
        document.getElementById('collapse-sidebar').addEventListener('click', () => {
            sidebar.classList.toggle('-ml-64');
        });

        // --- UTILS ---
        const escapeHtml = (unsafe) => {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;").replace(/\n/g, "<br>");
        };

        const formatCodeBlocks = (text) => {
            return text.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const id = 'code-' + Math.random().toString(36).substr(2, 9);
                return `<div class="relative bg-[#08090b] rounded-lg border border-gray-800 my-3 group shadow-inner">
                    <div class="flex items-center justify-between px-3 py-1.5 border-b border-gray-800/50 bg-gray-900/50">
                        <span class="text-[10px] text-gray-500 font-mono lowercase">${lang || 'code'}</span>
                        <button class="text-gray-500 hover:text-white transition-colors" onclick="navigator.clipboard.writeText(document.getElementById('${id}').innerText); this.innerHTML='<i data-lucide=\\'check\\' class=\\'w-3 h-3 text-brand-400\\'></i>'; lucide.createIcons(); setTimeout(() => { this.innerHTML='<i data-lucide=\\'copy\\' class=\\'w-3 h-3\\'></i>'; lucide.createIcons(); }, 2000)"><i data-lucide="copy" class="w-3 h-3"></i></button>
                    </div>
                    <pre class="p-3 overflow-x-auto text-[11px] custom-scrollbar"><code id="${id}">${escapeHtml(code).trim()}</code></pre>
                </div>`;
            });
        };

        const streamText = async (element, text, instant = false) => {
            if (instant) {
                element.innerHTML = formatCodeBlocks(text);
                return;
            }
            element.innerHTML = '<span class="text-brand-500 font-bold animate-pulse">|</span>';
            let currentHtml = '';
            for (let i = 0; i < text.length; i++) {
                currentHtml += text[i];
                element.innerHTML = escapeHtml(currentHtml) + '<span class="text-brand-500 font-bold animate-pulse">|</span>';
                if (i % 3 === 0) await new Promise(r => setTimeout(r, 2)); 
            }
            element.innerHTML = formatCodeBlocks(text);
        };

        const updateStats = (model, data) => {
            if(!data) {
                const el1 = document.querySelector(`#col-${model} .latency-val`);
                if(el1) el1.textContent = '--';
                const el2 = document.querySelector(`#col-${model} .rate-val`);
                if(el2) el2.textContent = '--';
                const el3 = document.querySelector(`#col-${model} .words-val`);
                if(el3) el3.textContent = '0';
                const el4 = document.querySelector(`#col-${model} .chars-val`);
                if(el4) el4.textContent = '0';
                return;
            }
            document.querySelector(`#col-${model} .latency-val`).textContent = data.latency;
            document.querySelector(`#col-${model} .rate-val`).textContent = data.tokenRate || '--';
            document.querySelector(`#col-${model} .words-val`).textContent = data.words || 0;
            document.querySelector(`#col-${model} .chars-val`).textContent = data.chars || 0;
        };

        // --- EVALUATION ---
        const evaluateResponses = (data) => {
            let fastestModel = null, minLatency = Infinity;
            let mostComp = null, maxTokens = 0;
            let bestCode = null, maxCodeBlocks = -1;
            const names = { gpt: 'GPT-4o', claude: 'Claude 3.7', gemini: 'Gemini 2.5', deepseek: 'DeepSeek R1' };
            
            Object.keys(names).forEach(m => {
                const t = document.getElementById(`trophy-${m}`);
                if(t) t.classList.add('hidden');
            });

            // Only evaluate active checked models
            const activeModels = Array.from(toggles).filter(t => t.checked).map(t => t.value);

            activeModels.forEach(model => {
                if(!data[model]) return;
                const text = data[model].text || '';
                const latency = parseFloat(data[model].latency.replace('s', '')) || 999;
                const tokens = text.split(/\s+/).length;
                const codeMatch = text.match(/```/g);
                const codeBlocks = codeMatch ? codeMatch.length / 2 : 0;

                if(latency < minLatency) { minLatency = latency; fastestModel = model; }
                if(tokens > maxTokens) { maxTokens = tokens; mostComp = model; }
                if(codeBlocks > maxCodeBlocks && codeBlocks > 0) { maxCodeBlocks = codeBlocks; bestCode = model; }
            });

            if(!bestCode) bestCode = mostComp;
            
            document.getElementById('eval-fastest').textContent = names[fastestModel] || '--';
            document.getElementById('eval-comprehensive').textContent = names[mostComp] || '--';
            document.getElementById('eval-code').textContent = names[bestCode] || '--';
            
            const banner = document.getElementById('evaluator-banner');
            banner.classList.remove('hidden');
            banner.classList.add('flex');

            const scores = {};
            if(fastestModel) scores[fastestModel] = (scores[fastestModel] || 0) + 1;
            if(mostComp) scores[mostComp] = (scores[mostComp] || 0) + 1;
            if(bestCode) scores[bestCode] = (scores[bestCode] || 0) + 1;
            
            let winner = fastestModel, maxScore = 0;
            Object.keys(scores).forEach(m => {
                if(scores[m] > maxScore) { maxScore = scores[m]; winner = m; }
            });
            
            if(winner) {
                const t = document.getElementById(`trophy-${winner}`);
                if(t) t.classList.remove('hidden');
            }
        };

        // --- HISTORY MANAGEMENT ---
        const renderHistory = () => {
            historyList.innerHTML = '';
            sessions.slice().reverse().forEach((session, i) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-3 py-2 rounded-lg text-xs truncate transition-colors ${session.id === activeSessionId ? 'bg-gray-800 text-brand-400' : 'text-gray-400 hover:bg-gray-800/50 hover:text-gray-200'}`;
                btn.innerHTML = `<i data-lucide="message-square" class="w-3.5 h-3.5 inline mr-1.5 opacity-70"></i> ${session.title}`;
                btn.onclick = () => loadSession(session.id);
                historyList.appendChild(btn);
            });
            lucide.createIcons();
        };

        const saveSession = (prompt, data) => {
            const title = prompt.length > 25 ? prompt.substring(0, 25) + '...' : prompt;
            const newSession = {
                id: Date.now().toString(),
                title: title,
                prompt: prompt,
                data: data,
                mode: modeSelect.value
            };
            sessions.push(newSession);
            activeSessionId = newSession.id;
            localStorage.setItem('aifiesta_history', JSON.stringify(sessions));
            chatTitle.textContent = title;
            renderHistory();
        };

        const loadSession = (id) => {
            const session = sessions.find(s => s.id === id);
            if (!session) return;
            activeSessionId = session.id;
            chatTitle.textContent = session.title;
            promptInput.value = session.prompt;
            modeSelect.value = session.mode || 'General Query';
            
            Array.from(toggles).forEach(toggle => {
                const model = toggle.value;
                if (session.data[model]) {
                    streamText(document.getElementById(`stream-${model}`), session.data[model].text, true);
                    updateStats(model, session.data[model]);
                } else {
                    document.getElementById(`stream-${model}`).innerHTML = '';
                    updateStats(model, null);
                }
            });
            evaluateResponses(session.data);
            renderHistory();
        };

        // --- API INTEGRATION ---
        const handleSend = async () => {
            const prompt = promptInput.value.trim();
            if (!prompt || isGenerating) return;

            const persona = modeSelect.value;
            
            isGenerating = true;
            sendBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin text-white"></i>';
            lucide.createIcons();

            document.getElementById('evaluator-banner').classList.add('hidden');
            document.getElementById('evaluator-banner').classList.remove('flex');
            
            const activeModels = Array.from(toggles).filter(t => t.checked).map(t => t.value);

            Array.from(toggles).forEach(toggle => {
                const model = toggle.value;
                if (toggle.checked) {
                    document.getElementById(`stream-${model}`).innerHTML = '<div class="text-brand-500 animate-pulse">Generating...</div>';
                } else {
                    document.getElementById(`stream-${model}`).innerHTML = '';
                    updateStats(model, null);
                }
            });

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, persona })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    
                    activeModels.forEach(model => {
                        const payloadKey = model === 'gpt' ? 'chatgpt' : model;
                        if (data[payloadKey]) {
                            streamText(document.getElementById(`stream-${model}`), data[payloadKey].text);
                            updateStats(model, data[payloadKey]);
                        }
                    });
                    
                    evaluateResponses(data);
                    saveSession(prompt, data);
                } else {
                    activeModels.forEach(model => {
                        document.getElementById(`stream-${model}`).innerHTML = `<div class="text-red-500">Error: ${result.error}</div>`;
                    });
                }
            } catch (error) {
                console.error("API Error:", error);
                activeModels.forEach(model => {
                    document.getElementById(`stream-${model}`).innerHTML = '<div class="text-red-500">Failed to connect to backend.</div>';
                });
            } finally {
                isGenerating = false;
                sendBtn.innerHTML = '<i data-lucide="arrow-up" class="w-5 h-5 text-white"></i>';
                lucide.createIcons();
            }
        };

        sendBtn.addEventListener('click', handleSend);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
        
        // --- ACTIONS ---
        enhanceBtn.addEventListener('click', () => {
            const p = promptInput.value.trim();
            if(!p) return;
            promptInput.value = p + " \n\nPlease add edge cases, benchmarks, and production code.";
            handleSend();
        });

        document.getElementById('clear-canvas-btn').addEventListener('click', () => {
            promptInput.value = '';
            chatTitle.textContent = 'New Conversation';
            activeSessionId = null;
            document.getElementById('evaluator-banner').classList.add('hidden');
            Array.from(toggles).forEach(toggle => {
                document.getElementById(`stream-${toggle.value}`).innerHTML = '';
                updateStats(toggle.value, null);
                const t = document.getElementById(`trophy-${toggle.value}`);
                if(t) t.classList.add('hidden');
            });
            renderHistory();
        });

        document.getElementById('new-chat-btn').addEventListener('click', () => {
            document.getElementById('clear-canvas-btn').click();
        });

        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const targetId = e.currentTarget.getAttribute('data-target');
                const text = document.getElementById(targetId).innerText;
                navigator.clipboard.writeText(text);
                const icon = e.currentTarget.innerHTML;
                e.currentTarget.innerHTML = '<i data-lucide="check" class="w-3 h-3 text-brand-400"></i>';
                lucide.createIcons();
                setTimeout(() => { e.currentTarget.innerHTML = icon; lucide.createIcons(); }, 2000);
            });
        });

        document.getElementById('export-md-btn').addEventListener('click', () => {
            const session = sessions.find(s => s.id === activeSessionId);
            if (!session) return alert("No active session to export.");
            let md = `# Ai maneesha Comparison\n\n**Prompt:** ${session.prompt}\n\n`;
            ['gpt', 'claude', 'gemini', 'deepseek'].forEach(model => {
                if(session.data[model]) {
                    md += `## ${model.toUpperCase()} (Latency: ${session.data[model].latency})\n\n${session.data[model].text}\n\n---\n\n`;
                }
            });
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `aifiesta-${session.id}.md`;
            a.click();
        });

        // Auto-expand textarea
        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (this.value === '') this.style.height = 'auto';
        });

        // Preset Pills
        document.querySelectorAll('.preset-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                promptInput.value = e.target.getAttribute('data-prompt');
                promptInput.style.height = 'auto';
                promptInput.style.height = promptInput.scrollHeight + 'px';
                handleSend();
            });
        });

        // Init
        renderHistory();
        if(sessions.length > 0) {
            loadSession(sessions[sessions.length-1].id);
        }
    </script>
</body>
</html>
